<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>OBS Ticker Configurator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark light">
<style>
:root {
  --ui-bg: #1a1a2e !important;
  --ui-panel: #16213e !important;
  --ui-border: #0f3460 !important;
  --ui-accent: #e94560 !important;
  --ui-text: #eaeaea !important;
  --ui-muted: #888 !important;
  --ui-input: #0f3460 !important;
  --ui-success: #27ae60 !important;
}
[data-darkreader-ignore], [data-darkreader-ignore] * {
  background-color: inherit !important;
  color: inherit !important;
  border-color: inherit !important;
}
html { filter: none !important; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--ui-bg); color: var(--ui-text); min-height: 100vh; padding: 24px; }
h1 { font-size: 1.5rem; margin-bottom: 8px; color: var(--ui-accent); }
.subtitle { color: var(--ui-muted); margin-bottom: 24px; font-size: 0.9rem; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 20px; max-width: 1400px; }
.panel { background: var(--ui-panel); border: 1px solid var(--ui-border); border-radius: 12px; padding: 20px; }
.panel h2 { font-size: 1rem; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid var(--ui-border); display: flex; align-items: center; gap: 8px; }
.panel h2::before { content: ''; width: 10px; height: 10px; background: var(--ui-accent); border-radius: 2px; }
.field { margin-bottom: 16px; }
.field:last-child { margin-bottom: 0; }
label { display: block; font-size: 0.85rem; margin-bottom: 6px; color: var(--ui-muted); }
.input-wrap { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
input[type="text"], input[type="number"], select { padding: 10px 12px; background: var(--ui-input); border: 1px solid var(--ui-border); border-radius: 8px; color: var(--ui-text); font-size: 0.9rem; outline: none; transition: border-color 0.2s; }
input[type="text"]:focus, input[type="number"]:focus, select:focus { border-color: var(--ui-accent); }
input[type="color"] { width: 44px; height: 44px; border: none; border-radius: 8px; cursor: pointer; background: none; padding: 2px; }
.color-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.color-row input[type="text"] { flex: 1; min-width: 100px; }
.color-row input[type="number"] { width: 70px; }
.checkbox-row { display: flex; align-items: center; gap: 10px; }
.checkbox-row input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--ui-accent); cursor: pointer; }
.checkbox-row label { margin: 0; cursor: pointer; font-size: 0.9rem; color: var(--ui-text); }
.slider-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.slider-row input[type="range"] { flex: 1; min-width: 150px; accent-color: var(--ui-accent); }
.slider-row input[type="number"] { width: 70px; }
.btn-add { background: var(--ui-border); color: var(--ui-text); border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; }
.btn-add:hover { background: var(--ui-accent); color: white; }
.actions { display: flex; gap: 12px; margin-top: 24px; flex-wrap: wrap; }
.btn { padding: 12px 24px; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; }
.btn-primary { background: var(--ui-accent); color: white; }
.btn-primary:hover { filter: brightness(1.1); }
.btn-success { background: var(--ui-success); color: white; }
.btn-success:hover { filter: brightness(1.1); }
.btn-secondary { background: var(--ui-border); color: var(--ui-text); }
.btn-secondary:hover { background: #1a4a7a; }
.preview-panel { position: sticky; top: 24px; align-self: start; }
.preview-frame { border-radius: 12px; overflow: hidden; border: 2px solid var(--ui-border); background: #000; height: 220px; }
.preview-frame iframe { width: 100%; height: 100%; border: none; display: block; }
.toast { position: fixed; bottom: 24px; right: 24px; padding: 14px 24px; border-radius: 8px; background: var(--ui-panel); border: 1px solid var(--ui-border); color: var(--ui-text); box-shadow: 0 8px 32px rgba(0,0,0,0.4); transform: translateY(100px); opacity: 0; transition: all 0.3s; z-index: 1000; }
.toast.show { transform: translateY(0); opacity: 1; }
.toast.success { border-color: var(--ui-success); }
.toast.error { border-color: var(--ui-accent); }
@media (max-width: 768px) { .radius-presets { grid-template-columns: repeat(3, 1fr); } }
</style>
</head>
<body data-darkreader-ignore>
<h1>OBS Ticker Configurator</h1>
<p class="subtitle">Configure cores, fontes, tamanhos. Preview ao vivo + exportação para OBS.</p>

<div class="grid" data-darkreader-ignore>
  <div data-darkreader-ignore>
    <!-- Colors -->
    <div class="panel">
      <h2>🎨 Cores</h2>
      <div class="field">
        <label>Cor do texto principal (--primary-color)</label>
        <div class="color-row">
          <input type="color" id="primaryColor" value="#00ff9d">
          <input type="text" id="primaryColorHex" value="#00ff9d" placeholder="#RRGGBB">
        </div>
      </div>
      <div class="field">
        <label>Cor do glow (--primary-glow-color)</label>
        <div class="color-row">
          <input type="color" id="primaryGlowColor" value="#00ff9d">
          <input type="text" id="primaryGlowColorHex" value="#00ff9d" placeholder="#RRGGBB">
          <label style="font-size:0.8rem;white-space:nowrap;">Alpha</label>
          <input type="range" id="primaryGlowAlpha" min="0" max="1" step="0.01" value="0.7">
          <input type="number" id="primaryGlowAlphaNum" min="0" max="1" step="0.01" value="0.7" style="width:70px;">
        </div>
      </div>
      <div class="field">
        <label>Cor dos bullets (--accent-color)</label>
        <div class="color-row">
          <input type="color" id="accentColor" value="#ff00dd">
          <input type="text" id="accentColorHex" value="#ff00dd" placeholder="#RRGGBB">
        </div>
      </div>
      <div class="field">
        <label>Glow dos bullets (--accent-glow-color)</label>
        <div class="color-row">
          <input type="color" id="accentGlowColor" value="#ff00dd">
          <input type="text" id="accentGlowColorHex" value="#ff00dd" placeholder="#RRGGBB">
          <label style="font-size:0.8rem;white-space:nowrap;">Alpha</label>
          <input type="range" id="accentGlowAlpha" min="0" max="1" step="0.01" value="0.9">
          <input type="number" id="accentGlowAlphaNum" min="0" max="1" step="0.01" value="0.9" style="width:70px;">
        </div>
      </div>
      <div class="field">
        <label>Gradiente início (--bg-gradient-start)</label>
        <div class="color-row">
          <input type="color" id="bgStartColor" value="#000000">
          <input type="text" id="bgStartColorHex" value="#000000" placeholder="#RRGGBB">
          <label style="font-size:0.8rem;white-space:nowrap;">Alpha</label>
          <input type="range" id="bgStartAlpha" min="0" max="1" step="0.01" value="0.9">
          <input type="number" id="bgStartAlphaNum" min="0" max="1" step="0.01" value="0.9" style="width:70px;">
        </div>
      </div>
      <div class="field">
        <label>Gradiente meio (--bg-gradient-middle)</label>
        <div class="color-row">
          <input type="color" id="bgMiddleColor" value="#1b135e">
          <input type="text" id="bgMiddleColorHex" value="#1b135e" placeholder="#RRGGBB">
          <label style="font-size:0.8rem;white-space:nowrap;">Alpha</label>
          <input type="range" id="bgMiddleAlpha" min="0" max="1" step="0.01" value="0.9">
          <input type="number" id="bgMiddleAlphaNum" min="0" max="1" step="0.01" value="0.9" style="width:70px;">
        </div>
      </div>
      <div class="field">
        <label>Gradiente fim (--bg-gradient-end)</label>
        <div class="color-row">
          <input type="color" id="bgEndColor" value="#000000">
          <input type="text" id="bgEndColorHex" value="#000000" placeholder="#RRGGBB">
          <label style="font-size:0.8rem;white-space:nowrap;">Alpha</label>
          <input type="range" id="bgEndAlpha" min="0" max="1" step="0.01" value="0.9">
          <input type="number" id="bgEndAlphaNum" min="0" max="1" step="0.01" value="0.9" style="width:70px;">
        </div>
      </div>
    </div>

    <!-- Sizing -->
    <div class="panel">
      <h2>📏 Tamanhos</h2>
      <div class="field">
        <label>Altura do ticker (--ticker-height)</label>
        <div class="slider-row">
          <input type="range" id="tickerHeight" min="40" max="300" value="120">
          <input type="number" id="tickerHeightNum" min="40" max="300" value="120">
        </div>
      </div>
      <div class="field">
        <label>Tamanho da fonte (--font-size)</label>
        <div class="slider-row">
          <input type="range" id="fontSize" min="12" max="100" value="42">
          <input type="number" id="fontSizeNum" min="12" max="100" value="42">
        </div>
      </div>
      <div class="field">
        <label>Espessura da borda (--border-thickness)</label>
        <div class="slider-row">
          <input type="range" id="borderThickness" min="1" max="20" value="4">
          <input type="number" id="borderThicknessNum" min="1" max="20" value="4">
        </div>
      </div>
    </div>

    <!-- Typography -->
    <div class="panel">
      <h2>🔤 Tipografia</h2>
      <div class="field">
        <label>Fonte</label>
        <select id="fontFamily">
          <option value="'Orbitron', sans-serif">Orbitron (padrão)</option>
          <option value="'Rajdhani', sans-serif">Rajdhani</option>
          <option value="'Exo 2', sans-serif">Exo 2</option>
          <option value="'Share Tech Mono', monospace">Share Tech Mono</option>
          <option value="'JetBrains Mono', monospace">JetBrains Mono</option>
          <option value="'Fira Code', monospace">Fira Code</option>
          <option value="'Segoe UI', system-ui, sans-serif">Segoe UI</option>
          <option value="'Roboto', sans-serif">Roboto</option>
          <option value="'Inter', sans-serif">Inter</option>
          <option value="custom">✏️ Personalizada...</option>
        </select>
      </div>
      <div class="field" id="customFontRow" style="display:none;">
        <label>Nome da fonte customizada</label>
        <input type="text" id="customFontName" placeholder="Ex: 'Minha Fonte', sans-serif">
      </div>
    </div>

    <!-- Behavior -->
    <div class="panel">
      <h2>⚙️ Comportamento</h2>
      <div class="field">
        <label>Velocidade (speedFactor - maior = mais lento)</label>
        <div class="slider-row">
          <input type="range" id="speedFactor" min="0.02" max="3" step="0.01" value="0.2">
          <input type="number" id="speedFactorNum" min="0.02" max="3" step="0.01" value="0.2">
        </div>
      </div>
      <div class="field">
        <label>Duração mínima (segundos)</label>
        <div class="slider-row">
          <input type="range" id="minDuration" min="5" max="300" value="30">
          <input type="number" id="minDurationNum" min="5" max="300" value="30">
        </div>
      </div>
      <div class="field">
        <label>Usar feed RSS</label>
        <div class="checkbox-row">
          <input type="checkbox" id="useRssFeed" checked>
          <label for="useRssFeed">Ativar RSS (desmarque para texto customizado)</label>
        </div>
      </div>
      <div class="field" id="rssUrlRow">
        <label>URL do feed RSS</label>
        <input type="text" id="rssUrl" value="https://www.newsinside.org/feed/" placeholder="https://...">
      </div>
      <div class="field" id="rssIntervalRow">
        <label>Intervalo atualização (minutos)</label>
        <div class="slider-row">
          <input type="range" id="rssRefreshInterval" min="1" max="120" value="5">
          <input type="number" id="rssRefreshIntervalNum" min="1" max="120" value="5">
        </div>
      </div>
      <div class="field" id="customTextRow" style="display:none;">
        <label>Texto customizado (uma linha por item)</label>
        <textarea id="customText" rows="6" placeholder="Linha 1&#10;Linha 2&#10;Linha 3" style="width:100%;padding:10px;background:var(--ui-input);border:1px solid var(--ui-border);border-radius:8px;color:var(--ui-text);font-family:monospace;font-size:0.85rem;resize:vertical;box-sizing:border-box;"></textarea>
        <small style="color:var(--ui-muted);font-size:0.75rem;">Cada linha será um item separado, unidos por bullets ●</small>
      </div>
    </div>

    <!-- Actions -->
    <div class="panel" style="text-align:center;">
      <div class="actions">
        <button class="btn btn-primary" id="btnApply">🔄 Aplicar no Preview</button>
        <button class="btn btn-success" id="btnSave">💾 Salvar (style.css + script.js)</button>
        <button class="btn btn-secondary" id="btnExport">📥 Exportar JSON</button>
        <button class="btn btn-secondary" id="btnImport">📤 Importar JSON</button>
        <button class="btn btn-secondary" id="btnReset">🔙 Reset Padrões</button>
      </div>
    </div>
  </div>

  <!-- Right: Live Preview -->
  <div class="preview-panel">
    <div class="panel" style="padding:0;">
      <h2 style="margin:0 20px; padding:16px 0; border-bottom:1px solid var(--ui-border); font-size:1rem;">📺 Preview ao Vivo</h2>
      <div class="preview-frame" data-darkreader-ignore>
        <iframe id="previewFrame" src="index.html" data-darkreader-ignore></iframe>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="jsonImport" accept=".json" style="display:none;">

<script>
// ===== Default State (matches original CSS variables) =====
const defaultState = {
  // Colors
  primaryColor: '#00ff9d',
  primaryGlowColor: '#00ff9d', primaryGlowAlpha: 0.7,
  accentColor: '#ff00dd',
  accentGlowColor: '#ff00dd', accentGlowAlpha: 0.9,
  bgStartColor: '#000000', bgStartAlpha: 0.9,
  bgMiddleColor: '#1b135e', bgMiddleAlpha: 0.9,
  bgEndColor: '#000000', bgEndAlpha: 0.9,
  // Sizing
  tickerHeight: 120,
  fontSize: 42,
  borderThickness: 4,
  // Typography
  fontFamily: "'Orbitron', sans-serif", customFontName: '',
  // Behavior
  speedFactor: 0.2,
  minDuration: 30,
  useRssFeed: true,
  rssUrl: 'https://www.newsinside.org/feed/',
  rssRefreshInterval: 5,
  customText: [
    "Bem vindos xD",
    "Siga para Mais",
    "Obrigada por assistirem",
    "Destrutivamente Arrumado"
  ]
};

const state = JSON.parse(JSON.stringify(defaultState));

// ===== DOM Elements =====
const els = {};
document.querySelectorAll('[id]').forEach(el => { els[el.id] = el; });

// ===== Helpers =====
function showToast(msg, type = '') {
  const t = els.toast;
  t.textContent = msg;
  t.className = 'toast show ' + type;
  setTimeout(() => t.classList.remove('show'), 3000);
}

function syncColorPicker(colorId, hexId) {
  const c = els[colorId], h = els[hexId];
  if (!c || !h) return;
  c.addEventListener('input', () => { h.value = c.value; debouncedApply(); });
  h.addEventListener('input', () => { if (/^#[0-9a-fA-F]{6}$/.test(h.value)) { c.value = h.value; debouncedApply(); } });
}

function syncAlpha(alphaRangeId, alphaNumId) {
  const r = els[alphaRangeId], n = els[alphaNumId];
  if (!r || !n) return;
  r.addEventListener('input', () => { n.value = r.value; debouncedApply(); });
  n.addEventListener('input', () => { const v = parseFloat(n.value); if (!isNaN(v) && v >= parseFloat(r.min) && v <= parseFloat(r.max)) { r.value = v; debouncedApply(); } });
}

function syncSliderNumber(sliderId, numId) {
  const s = els[sliderId], n = els[numId];
  if (!s || !n) return;
  s.addEventListener('input', () => { n.value = s.value; debouncedApply(); });
  n.addEventListener('input', () => { const v = parseFloat(n.value); if (!isNaN(v) && v >= parseFloat(s.min) && v <= parseFloat(s.max)) { s.value = v; debouncedApply(); } });
}

function toggleRows(checkboxId, rowMap) {
  const cb = els[checkboxId];
  if (!cb) return;
  const update = () => { Object.entries(rowMap).forEach(([id, inverse]) => { const el = els[id]; if (el) el.style.display = (inverse ? !cb.checked : cb.checked) ? '' : 'none'; }); };
  cb.addEventListener('change', update);
  update();
}

// ===== Init Sync =====
[
  ['primaryColor','primaryColorHex'],
  ['primaryGlowColor','primaryGlowColorHex'],
  ['accentColor','accentColorHex'],
  ['accentGlowColor','accentGlowColorHex'],
  ['bgStartColor','bgStartColorHex'],
  ['bgMiddleColor','bgMiddleColorHex'],
  ['bgEndColor','bgEndColorHex']
].forEach(([c,h]) => syncColorPicker(c,h));

[
  ['primaryGlowAlpha','primaryGlowAlphaNum'],
  ['accentGlowAlpha','accentGlowAlphaNum'],
  ['bgStartAlpha','bgStartAlphaNum'],
  ['bgMiddleAlpha','bgMiddleAlphaNum'],
  ['bgEndAlpha','bgEndAlphaNum']
].forEach(([r,n]) => syncAlpha(r,n));

[
  ['tickerHeight','tickerHeightNum'],
  ['fontSize','fontSizeNum'],
  ['borderThickness','borderThicknessNum'],
  ['speedFactor','speedFactorNum'],
  ['minDuration','minDurationNum'],
  ['rssRefreshInterval','rssRefreshIntervalNum']
].forEach(([s,n]) => syncSliderNumber(s,n));

// Toggles
els.fontFamily.addEventListener('change', () => { els.customFontRow.style.display = els.fontFamily.value === 'custom' ? '' : 'none'; });
els.useRssFeed.addEventListener('change', () => {
  const checked = els.useRssFeed.checked;
  els.rssUrlRow.style.display = checked ? '' : 'none';
  els.rssIntervalRow.style.display = checked ? '' : 'none';
  els.customTextRow.style.display = checked ? 'none' : '';
});

// ===== State <-> UI =====
function uiToState() {
  Object.keys(state).forEach(key => {
    if (key === 'customText') return;
    const el = els[key];
    if (!el) return;
    if (el.type === 'checkbox') state[key] = el.checked;
    else if (el.type === 'number' || el.type === 'range') state[key] = parseFloat(el.value);
    else if (el.type === 'color') state[key] = el.value;
    else if (el.tagName === 'TEXTAREA') state[key] = el.value.split('\n').map(s => s.trim()).filter(s => s);
    else state[key] = el.value;
  });
  if (els.fontFamily.value === 'custom') state.fontFamily = els.customFontName.value || "'Orbitron', sans-serif";
  if (els.customText) state.customText = els.customText.value.split('\n').map(s => s.trim()).filter(s => s);
}

function stateToUi() {
  Object.keys(state).forEach(key => {
    if (key === 'customText') return;
    const el = els[key];
    if (!el) return;
    if (el.type === 'checkbox') el.checked = state[key];
    else if (el.type === 'number' || el.type === 'range') el.value = state[key];
    else if (el.type === 'color') el.value = state[key];
    else if (el.tagName === 'TEXTAREA') el.value = state[key].join('\n');
    else el.value = state[key];
  });
  els.customFontRow.style.display = (els.fontFamily.value === 'custom') ? '' : 'none';
  if (els.customText) els.customText.value = state.customText.join('\n');
  const checked = state.useRssFeed;
  els.rssUrlRow.style.display = checked ? '' : 'none';
  els.rssIntervalRow.style.display = checked ? '' : 'none';
  els.customTextRow.style.display = checked ? 'none' : '';
}

// ===== Generate CSS (matches original exactly) =====
function generateCSS() {
  const s = state;
  const pGlow = hexToRgba(s.primaryGlowColor, s.primaryGlowAlpha);
  const aGlow = hexToRgba(s.accentGlowColor, s.accentGlowAlpha);
  const bgStart = hexToRgba(s.bgStartColor, s.bgStartAlpha);
  const bgMiddle = hexToRgba(s.bgMiddleColor, s.bgMiddleAlpha);
  const bgEnd = hexToRgba(s.bgEndColor, s.bgEndAlpha);

  return `/*============================================================
==                🎨 CUSTOMIZE SETTINGS HERE 🎨             ==
============================================================*/
:root {
    /* --- COLORS --- */
    --primary-color: ${s.primaryColor};
    --primary-glow-color: ${pGlow};
    --accent-color: ${s.accentColor};
    --accent-glow-color: ${aGlow};
    --bg-gradient-start: ${bgStart};
    --bg-gradient-middle: ${bgMiddle};
    --bg-gradient-end: ${bgEnd};
    /* --- SIZING (in pixels) --- */
    --ticker-height: ${s.tickerHeight}px;
    --font-size: ${s.fontSize}px;
    --border-thickness: ${s.borderThickness}px;
}
/*==========================================================*/

@import url("https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap");

body {
    margin: 0;
    overflow: hidden;
    background: transparent;
    font-family: "${s.fontFamily}";
}

#ticker {
    position: absolute;
    bottom: 0;
    width: 100%;
    white-space: nowrap;
    overflow: hidden;
    box-sizing: border-box;
    padding: 30px 0;
    color: var(--primary-color);
    background: linear-gradient(
        90deg,
        var(--bg-gradient-start) 0%,
        var(--bg-gradient-middle) 50%,
        var(--bg-gradient-end) 100%
    );
    box-shadow: 0 0 30px var(--primary-glow-color);
    text-shadow: 0 0 15px var(--primary-glow-color);
    height: var(--ticker-height);
    font-size: var(--font-size);
    border-top: var(--border-thickness) solid var(--primary-color);
    border-bottom: var(--border-thickness) solid var(--primary-color);
    line-height: calc(var(--ticker-height) - 60px - (2 * var(--border-thickness)));
}

.scrolling-text {
    display: inline-block;
    padding-left: 100%;
    animation-name: scroll;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
    will-change: transform;
}

.bullet-point {
    margin: 0 1em;
    font-size: calc(var(--font-size) + 6px);
    color: var(--accent-color);
    text-shadow: 0 0 15px var(--accent-glow-color);
}

@keyframes scroll {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-100%); }
}`;
}

function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

// ===== Generate script.js (matches original exactly) =====
function generateScriptJS() {
  const s = state;
  return `/*============================================================
==              ⚙️ CUSTOMIZE SETTINGS HERE ⚙️             ==
============================================================*/
const CONFIG = {
    speedFactor: ${s.speedFactor},
    minDuration: ${s.minDuration},
    useRssFeed: ${s.useRssFeed},
    rssUrl: "${s.rssUrl}",
    customText: ${JSON.stringify(s.customText)},
    rssRefreshIntervalMinutes: ${s.rssRefreshInterval}
};
/*==========================================================*/

const VERSION = '0.4.0';
const LOCAL_RSS_PROXY = "/api/rss?url=";
const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.hostname === '0.0.0.0';
const PROXIED_RSS_URL = isLocalhost 
    ? LOCAL_RSS_PROXY + encodeURIComponent(CONFIG.rssUrl)
    : CONFIG.rssUrl;

function setTickerText(text) {
    const scrollingElement = document.querySelector(".scrolling-text");
    scrollingElement.innerHTML = text;
    const duration = Math.max(CONFIG.minDuration, text.length * CONFIG.speedFactor);
    scrollingElement.style.animation = \`scroll \${duration}s linear infinite\`;
}

function displayCustomText() {
    const tickerText = CONFIG.customText.join(' <span class="bullet-point">●</span> ');
    setTickerText(tickerText);
}

async function fetchRSS() {
    try {
        const response = await fetch(PROXIED_RSS_URL);
        if (!response.ok) throw new Error('HTTP error! status: ' + response.status);
        const text = await response.text();
        const parser = new DOMParser();
        const xml = parser.parseFromString(text, "text/xml");
        const items = xml.querySelectorAll("item");
        const headlines = Array.from(items).map(item => item.querySelector("title").textContent).filter(Boolean);
        if (headlines.length === 0) throw new Error("No headlines found in RSS feed.");
        const tickerText = headlines.join(' <span class="bullet-point">●</span> ');
        setTickerText(tickerText);
    } catch (error) {
        console.error("Error fetching RSS:", error);
        setTickerText("Error loading news feed. Check console for details.");
    }
}

function initializeTicker() {
    if (CONFIG.useRssFeed) {
        fetchRSS();
        setInterval(fetchRSS, CONFIG.rssRefreshIntervalMinutes * 60 * 1000);
    } else {
        displayCustomText();
    }
    console.log(\`OBS Ticker \${VERSION} initialized\`);
}

initializeTicker();`;
}

// ===== Apply to Preview =====
function applyToPreview() {
  uiToState();
  const iframe = els.previewFrame;
  const css = generateCSS();

  if (!iframe.contentDocument && !iframe.contentWindow) {
    setTimeout(applyToPreview, 100);
    return;
  }

  try {
    const doc = iframe.contentDocument || iframe.contentWindow.document;
    let styleEl = doc.getElementById('configurator-styles');
    if (!styleEl) {
      styleEl = doc.createElement('style');
      styleEl.id = 'configurator-styles';
      doc.head.appendChild(styleEl);
    }
    styleEl.textContent = css;
    showToast('Preview atualizado!', 'success');
  } catch (e) {
    console.warn('Could not inject CSS', e);
    iframe.src = 'index.html?' + Date.now();
  }
}

// ===== Save to Files (via server API) =====
async function saveToFiles() {
  uiToState();
  const css = generateCSS();
  const js = generateScriptJS();

  try {
    const response = await fetch('/api/save-config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ css, js })
    });
    
    const result = await response.json();
    if (response.ok) {
      showToast('✅ Salvo direto no servidor! OBS atualiza ao dar Refresh cache.', 'success');
    } else {
      throw new Error(result.message || 'Save failed');
    }
  } catch (err) {
    console.warn('Server save failed, falling back to download:', err);
    downloadFile('style.css', css, 'text/css');
    downloadFile('script.js', js, 'application/javascript');
    showToast('⚠️ Fallback: arquivos baixados. Mova para OBS_Ticker_v2.', 'error');
  }
}

function downloadFile(filename, content, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

// ===== Export/Import JSON =====
function exportJSON() { uiToState(); downloadFile('ticker-config.json', JSON.stringify(state, null, 2), 'application/json'); showToast('Exportado!', 'success'); }
function importJSON() { els.jsonImport.click(); }
els.jsonImport.addEventListener('change', (e) => { const file = e.target.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = (ev) => { try { Object.assign(state, JSON.parse(ev.target.result)); stateToUi(); applyToPreview(); showToast('Importado!', 'success'); } catch (err) { showToast('Erro: ' + err.message, 'error'); } e.target.value = ''; }; reader.readAsText(file); });

// ===== Reset =====
function resetDefaults() { if (!confirm('Restaurar padrões?')) return; Object.assign(state, JSON.parse(JSON.stringify(defaultState))); stateToUi(); applyToPreview(); showToast('Padrões restaurados!', 'success'); }

// ===== Debounced Apply =====
let debounceTimer;
function debouncedApply() { clearTimeout(debounceTimer); debounceTimer = setTimeout(applyToPreview, 200); }

// ===== Event Listeners =====
els.btnApply.addEventListener('click', applyToPreview);
els.btnSave.addEventListener('click', saveToFiles);
els.btnExport.addEventListener('click', exportJSON);
els.btnImport.addEventListener('click', importJSON);
els.btnReset.addEventListener('click', resetDefaults);

document.querySelectorAll('input, select, textarea').forEach(el => {
  el.addEventListener('input', debouncedApply);
  el.addEventListener('change', debouncedApply);
});

// Initial
stateToUi();
applyToPreview();
</script>
</body>
</html>
